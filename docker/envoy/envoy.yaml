admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 3000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          # upstream_host tells you which api replica served a request, which is
                          # what you need when debugging anything scale-related.
                          inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %RESPONSE_CODE% %DURATION%ms upstream=%UPSTREAM_HOST%\n"
                route_config:
                  name: local
                  virtual_hosts:
                    - name: app
                      domains: ['*']
                      routes:
                        # Reads first, so they can be retried more aggressively than writes.
                        # `unavailable` and `reset` can both happen *after* the upstream has already
                        # processed a request, so they are only safe on a method that changes
                        # nothing. This also covers the WebSocket upgrade, which is a GET.
                        - match:
                            prefix: '/'
                            headers:
                              - name: ':method'
                                string_match: { exact: 'GET' }
                          route:
                            cluster: api
                            timeout: 0s
                            retry_policy:
                              retry_on: 'connect-failure,refused-stream,unavailable,reset'
                              num_retries: 2
                        - match: { prefix: '/' }
                          route:
                            cluster: api
                            timeout: 0s
                            # Writes only retry where the request provably never reached an upstream.
                            # The previous policy included `unavailable` and `reset` and justified it
                            # with "sends are idempotent on clientId" — but clientId is optional, and
                            # POST /api/conversations and /:id/read are not deduplicated at all, so a
                            # reset mid-create could produce two conversations.
                            retry_policy:
                              retry_on: 'connect-failure,refused-stream'
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: api
      connect_timeout: 2s
      # STRICT_DNS re-resolves the `api` hostname, so `--scale api=3` is picked up without an
      # Envoy restart. Compose's DNS returns one A record per replica.
      type: STRICT_DNS
      # Re-resolve often enough that scaling up or down is reflected quickly.
      dns_refresh_rate: 5s
      respect_dns_ttl: false
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api, port_value: 3000 }
      # Take a replica out of rotation while it's restarting or still migrating, instead of
      # round-robining requests into a connection refused.
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /api/health
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 15s
