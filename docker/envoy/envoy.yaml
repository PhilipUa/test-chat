admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 3000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          # upstream_host tells you which api replica served a request, which is
                          # what you need when debugging anything scale-related.
                          inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %RESPONSE_CODE% %DURATION%ms upstream=%UPSTREAM_HOST%\n"
                route_config:
                  name: local
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: api
                            timeout: 0s
                            # Retry idempotent requests that hit a replica mid-restart, rather
                            # than surfacing a 503 to the browser. Safe because sends are
                            # idempotent on clientId — a retried POST returns the original
                            # message instead of writing a second one.
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,unavailable,reset"
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: api
      connect_timeout: 2s
      # STRICT_DNS re-resolves the `api` hostname, so `--scale api=3` is picked up without an
      # Envoy restart. Compose's DNS returns one A record per replica.
      type: STRICT_DNS
      # Re-resolve often enough that scaling up or down is reflected quickly.
      dns_refresh_rate: 5s
      respect_dns_ttl: false
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api, port_value: 3000 }
      # Take a replica out of rotation while it's restarting or still migrating, instead of
      # round-robining requests into a connection refused.
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /api/health
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 15s
