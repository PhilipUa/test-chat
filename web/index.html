<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay</title>
  <!-- Inline so there's no /favicon.ico request to 404 on. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b6df5'/%3E%3Cpath d='M8 11h16M8 16h12M8 21h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root { --line: #e4e4e7; --muted: #71717a; --accent: #3b6df5; --bg-soft: #f7f7f8; }
    * { box-sizing: border-box; }
    body { font: 15px/1.45 system-ui, sans-serif; margin: 0; display: flex; height: 100vh; color: #18181b; }

    #sidebar { width: 300px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    #sidebar header { display: flex; align-items: center; justify-content: space-between; padding: 12px; gap: 8px; }
    #sidebar h2 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0; }
    #newConv { font-size: 13px; cursor: pointer; }
    #whoami { padding: 0 12px 10px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    #userSelect { flex: 1; padding: 4px; font: inherit; }
    #searchForm { padding: 0 12px 12px; }
    #search { width: 100%; padding: 6px 8px; font: inherit; }
    #conversations { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
    #conversations li { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f1f1f2; display: flex; gap: 8px; align-items: flex-start; }
    #conversations li:hover { background: var(--bg-soft); }
    #conversations li.active { background: #eef3ff; box-shadow: inset 3px 0 0 var(--accent); }
    .conv-main { flex: 1; min-width: 0; }
    .conv-title { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-preview { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { background: var(--accent); color: #fff; border-radius: 10px; font-size: 11px; font-weight: 600; padding: 1px 7px; min-width: 20px; text-align: center; }
    .online-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #30a46c; margin-right: 6px; vertical-align: middle; }
    .conv-preview.typing-preview { color: var(--accent); font-style: italic; }

    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #titleBar { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
    #title { margin: 0; font-size: 16px; }
    #presence { font-size: 12px; color: var(--muted); margin-left: auto; }
    #connection { font-size: 12px; color: var(--muted); }
    #connection.down { color: #d4351c; }
    #messages { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .msg { padding: 5px 0; display: flex; gap: 8px; align-items: baseline; }
    .msg .who { font-weight: 600; flex-shrink: 0; }
    .msg .at { font-size: 11px; color: var(--muted); margin-left: auto; flex-shrink: 0; }
    .msg.pending { opacity: .55; }
    .msg.failed .body { color: #d4351c; }
    .result { padding: 8px 0; cursor: pointer; border-bottom: 1px solid #f4f4f5; }
    .result:hover { background: var(--bg-soft); }
    .result .where { display: block; font-size: 12px; color: var(--accent); font-weight: 600; }
    .more-results { width: 100%; padding: 6px; margin-top: 8px; font: inherit; cursor: pointer; }
    #loadOlder { display: none; width: 100%; padding: 6px; margin-bottom: 8px; font: inherit; cursor: pointer; }
    #typing { min-height: 20px; padding: 0 14px 4px; font-size: 13px; color: var(--muted); font-style: italic; }
    #notice { min-height: 18px; padding: 0 14px; font-size: 13px; color: #b45309; }
    #composer { display: flex; border-top: 1px solid var(--line); padding: 8px; gap: 8px; }
    #text { flex: 1; padding: 8px; font: inherit; }
    #composer button { padding: 8px 16px; font: inherit; cursor: pointer; }
    .empty { color: var(--muted); padding: 8px 0; }
  </style>
</head>
<body>
  <div id="sidebar">
    <header>
      <h2>Conversations</h2>
      <button id="newConv" type="button">+ New</button>
    </header>
    <!-- There's no auth in this app, so identity is a picker. Open two tabs as two different
         users to see the typing indicator and the unread badge do their thing. -->
    <div id="whoami">
      <label for="userSelect">Signed in as</label>
      <select id="userSelect"></select>
    </div>
    <form id="searchForm"><input id="search" autocomplete="off" placeholder="Search messages…" /></form>
    <ul id="conversations"></ul>
  </div>
  <div id="main">
    <div id="titleBar">
      <h3 id="title">Pick a conversation</h3>
      <span id="presence"></span>
      <span id="connection"></span>
    </div>
    <div id="messages">
      <button id="loadOlder" type="button">Load older messages</button>
    </div>
    <div id="typing"></div>
    <div id="notice"></div>
    <form id="composer">
      <input id="text" autocomplete="off" placeholder="Message…" />
      <button>Send</button>
    </form>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
