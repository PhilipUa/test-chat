services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "3000:3000"
      # Envoy's admin interface. `curl localhost:9901/clusters` shows which api replicas it has
      # actually discovered, which is the first thing you want when scaling.
      - "9901:9901"
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    # node directly, not `npm start`. With npm as PID 1 the SIGTERM from a scale-down or a redeploy
    # went to npm, which killed its child rather than letting it shut down — so none of the graceful
    # shutdown in src/server.ts ran, and every user the replica was holding stayed "online" for the
    # full presence TTL. `scripts/probe-failover.mjs` is the check.
    command: node --import tsx src/index.ts
    restart: on-failure
    env_file: .env
    expose: ["3000"]
    # Scaled with `docker compose up -d --scale api=3`; realtime state is shared through Redis
    # rather than held in process memory, so replicas are interchangeable.
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Only the source is bind-mounted, so /app/node_modules stays the one baked into the image.
    # The original mounted `./:/app` and papered over the resulting empty node_modules with an
    # anonymous volume — which Compose carries across container recreation, so a dependency added
    # to package.json never actually showed up. Mounting the source directly avoids that entirely,
    # and means N replicas can't race each other writing to one shared node_modules.
    volumes:
      - ./src:/app/src
      - ./web:/app/web
      - ./docker:/app/docker
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Mounted, not just baked in by the image build: the point of putting the rate limits in a file
      # is that editing the file changes them, and `docker compose restart api` is a much better loop
      # for retuning a limit than a rebuild.
      - ./rate-limit.config.json:/app/rate-limit.config.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    stop_grace_period: 15s

  # Runs the MySQL migrations and upserts the demo message bodies, then exits. Safe to re-run:
  # it no longer wipes anything (see docker/db/seed.ts).
  seed:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: npm run seed
    restart: "no"
    env_file: .env
    # Only the source is bind-mounted, so /app/node_modules stays the one baked into the image.
    # The original mounted `./:/app` and papered over the resulting empty node_modules with an
    # anonymous volume — which Compose carries across container recreation, so a dependency added
    # to package.json never actually showed up. Mounting the source directly avoids that entirely,
    # and means N replicas can't race each other writing to one shared node_modules.
    volumes:
      - ./src:/app/src
      - ./web:/app/web
      - ./docker:/app/docker
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Mounted, not just baked in by the image build: the point of putting the rate limits in a file
      # is that editing the file changes them, and `docker compose restart api` is a much better loop
      # for retuning a limit than a rebuild.
      - ./rate-limit.config.json:/app/rate-limit.config.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: relay
    ports: ["3306:3306"]
    volumes:
      - ./docker/db/mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    # Previously `condition: service_started`, which only waits for the container to exist — a
    # slow Mongo start was a race the app had to retry its way out of.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7
    expose: ["6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  mongo_data:
  redis_data:
